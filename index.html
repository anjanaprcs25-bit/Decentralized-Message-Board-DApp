<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decentralized Message Board</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
</head>
<body>
  <main class="card">
    <h1>Decentralized Message Board</h1>
    <p class="subtitle">Store and read a message on the Sepolia blockchain.</p>
    <button id="connectButton">Connect MetaMask</button>
    <p id="walletStatus" class="status">Wallet not connected</p>
    <hr>
    <label for="messageInput">Your message</label>
    <textarea id="messageInput" placeholder="Write a message..." rows="3"></textarea>
    <button id="saveButton" disabled>Save Message</button>
    <button id="readButton" class="secondary" disabled>Read Message</button>
    <section class="result">
      <h2>Stored message</h2>
      <p id="messageOutput">No message loaded yet.</p>
    </section>
    <p id="status" class="status"></p>
    <p class="network">Network: Sepolia testnet</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
